name: Bug report
description: Report an error in the demo, documentation, or evaluation assets.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this educational demo.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Portal demo runbook
        - Result interpretation guide
        - Agent instructions
        - Evaluation dataset
        - Images or links
        - Repository automation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what is incorrect, unclear, or not working.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps, portal screen, or file needed to see the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the behavior or content you expected.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant browser, Foundry portal region, or model details.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots or other non-sensitive context.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
