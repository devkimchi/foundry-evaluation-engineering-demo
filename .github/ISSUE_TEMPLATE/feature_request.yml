name: Feature request
description: Suggest an improvement to the demo or learning material.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Learning need
      description: What learner or presenter problem would this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the scenario, material, or workflow you would add.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive examples, screenshots, or references.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
